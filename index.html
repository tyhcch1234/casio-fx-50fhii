<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CASIO fx-50FH II · 網頁模擬計算機</title>
<meta name="description" content="Web emulation of the CASIO fx-50FH II: official keypad layout, two-line dot-matrix display, SHIFT/ALPHA layers, MODE menus and a real calculation engine.">
<style>
:root{
  --shell:#33363c;
  --face-a:#eceae5; --face-b:#d8d5ce; --face-c:#c4c1ba;
  --lcd-a:#e8f1ee; --lcd-b:#dde8e5;
  --key-a:#42454b; --key-b:#2b2e34;
  --orange-a:#f1964f; --orange-b:#cf6a24;
  --maroon-a:#593030; --maroon-b:#3d2021;
  --ink:#1c211a;
  --sh:#a9822c;
  --al:#bd3d33;
  --te:#3c8b81;
  --tl:#3a3d42;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;padding:22px 14px 34px;min-height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(900px 620px at 50% -8%,#333b46 0%,#181c22 45%,#0b0d10 100%);
  font-family:"Helvetica Neue",Arial,"PingFang TC","Noto Sans TC",sans-serif;
  color:#dfe3e8;user-select:none;
}
.caption{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#6f7a88;margin:0}

.device{
  width:376px;max-width:100%;padding:7px;border-radius:28px;
  background:linear-gradient(170deg,#4c5058 0%,#34373d 22%,#26292e 70%,#1b1e22 100%);
  box-shadow:0 30px 60px rgba(0,0,0,.65),0 4px 12px rgba(0,0,0,.4),
             inset 0 1px 0 rgba(255,255,255,.22), inset 0 -3px 8px rgba(0,0,0,.5);
  position:relative;
}
.face{
  border-radius:23px;padding:12px 11px 14px;position:relative;overflow:hidden;
  background:linear-gradient(164deg,#f0eee9 0%,#e2dfd8 42%,#cfccc4 78%,#c2bfb7 100%);
  box-shadow:inset 0 1px 0 #fff, inset 0 0 0 1px rgba(255,255,255,.5),
             inset 0 -2px 5px rgba(90,86,76,.22);
}

.hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:2px 3px 0}
.casio{font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:19px;letter-spacing:.1em;color:#25282d;line-height:1}
.model{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:12.5px;color:#2f3237;margin-top:5px;letter-spacing:.01em}
.solar{
  width:156px;height:40px;border-radius:4px;padding:3px;display:flex;gap:2px;
  background:#171310;box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.6);
}
.solar i{flex:1;border-radius:1px;background:linear-gradient(180deg,#57301d,#33190e 70%,#241009)}

.strip{display:flex;align-items:center;gap:4px;margin:7px 0 8px;padding:0 3px}
.strip .sq{display:block;width:5px;height:8px;background:#d95b22}
.strip .sq.big{width:8px;height:9px}
.strip .hk{font-size:6.6px;font-weight:700;letter-spacing:.09em;color:#a3552b;margin-left:2px}
.strip .plus{margin-left:auto;font-size:6.8px;font-style:italic;font-weight:700;letter-spacing:.14em;color:#3f4247}

.lcdwrap{
  border-radius:8px;padding:4px;background:linear-gradient(#b6b4ad,#a29f98);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.75);
}
.lcd{
  position:relative;height:90px;border-radius:4px;padding:4px 8px 5px;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--lcd-a),var(--lcd-b));
  box-shadow:inset 0 0 12px rgba(96,120,110,.28);
  font-family:"Courier New",Consolas,monospace;color:var(--ink);overflow:hidden;
}
.lcd::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
  background-image:radial-gradient(rgba(40,55,45,.18) .55px,transparent .55px);
  background-size:2.6px 2.6px;
}
.status{display:flex;gap:7px;align-items:center;height:9px;font-size:7px;font-weight:700;color:#3b4a37;letter-spacing:.04em;flex:0 0 auto;opacity:.75}
.status .i{opacity:.12;transition:opacity .1s}
.status .i.on{opacity:1}
.status .right{margin-left:auto;display:flex;gap:7px}
.l1{flex:1 1 auto;display:flex;align-items:flex-end;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;min-height:15px}
.l2{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:.06em;font-size:27px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;min-height:34px}
.lcd.menu .l1,.lcd.menu .l2{justify-content:flex-start;font-size:10.5px;font-weight:400;line-height:1.45;white-space:pre}
.lcd.menu .l2{align-items:flex-start;min-height:0}
.lcd.menu .l1{flex:1 1 0;align-items:flex-start}
.caret{display:inline-block;width:1px;height:15px;background:#1a2014;vertical-align:-2px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.l2 .frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:.44em;line-height:1.04;margin:0 .1em}
.l2 .frac span:not(.bar){display:block;padding:0 .06em}
.l2 .frac .bar{border-top:1.5px solid currentColor;width:100%;margin:.06em 0}
.l2 sup{font-size:.52em;vertical-align:super}

.pad{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.row{display:grid;gap:5px}
.row.top{align-items:center}
.r6{grid-template-columns:repeat(6,1fr)}
.r5{grid-template-columns:repeat(5,1fr)}
.kw{display:flex;flex-direction:column;gap:1px;min-width:0}
.row.top .kw{align-self:center;width:100%}
.row.top .lab{justify-content:center;gap:3px}
.row.top .lab .al{margin-left:0}
.lab{display:flex;align-items:center;height:8px;font-size:6.4px;line-height:1;white-space:nowrap;overflow:hidden}
.lab .sh{color:var(--sh);font-weight:700;letter-spacing:.01em}
.lab .tl{color:var(--tl);font-weight:700;letter-spacing:.02em}
.lab .al{margin-left:auto;font-weight:700}
.lab .al.red{color:var(--al)}
.lab .al.teal{color:var(--te)}

.k{
  position:relative;border:0;cursor:pointer;font-family:inherit;color:#eef0f2;
  height:27px;border-radius:8px;padding:0 1px;overflow:hidden;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:600;letter-spacing:.01em;
  background:linear-gradient(180deg,var(--key-a) 0%,var(--key-b) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.35);
  transition:transform .05s,box-shadow .05s;
}
.k:active,.k.press{
  transform:translateY(1px);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.55);
}
.k.orange{background:linear-gradient(180deg,var(--orange-a),var(--orange-b));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 1px rgba(0,0,0,.35)}
.k.maroon{background:linear-gradient(180deg,var(--maroon-a),var(--maroon-b));color:#f2625a;font-weight:700}
.k.oval{
  height:23px;border-radius:50%;font-size:8.5px;font-weight:700;color:#e8eaec;
  background:linear-gradient(180deg,#6a6e75,#4b4f56);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 1px rgba(0,0,0,.3);
}
.k.oval:active{box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.k.replay{
  width:62px;height:62px;justify-self:center;border-radius:50%;align-self:center;
  font-size:6.6px;letter-spacing:.12em;font-weight:700;color:#e9ebee;
  background:radial-gradient(circle at 50% 32%,#7d818a,#5a5e66 58%,#43474e 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 3px rgba(0,0,0,.4),0 0 0 3px #bab8b2,0 0 0 4px #8d8b85;
  flex-direction:column;gap:0;
}
.k.replay small{font-size:5.4px;letter-spacing:.1em;opacity:.85}
.k.num{height:31px;font-size:15px;border-radius:9px}
.k.dms{font-size:11px;letter-spacing:-.4px}

@media (max-width:420px){
  .device{width:100%;padding:8px;border-radius:26px}
  .face{padding:11px 9px 12px;border-radius:20px}
  .k{height:30px;font-size:13px}
  .k.num{height:34px;font-size:16px}
  .k.oval{height:22px}
  .k.replay{width:60px;height:60px}
  .lcd{height:92px}
}

.hint{font-size:10.5px;color:#6a7480;text-align:center;max-width:400px;line-height:1.7;margin:0}
.hint b{color:#94a0ae;font-weight:600}
</style>
</head>
<body>

<div class="device">
  <div class="face">
    <div class="hdr">
      <div>
        <div class="casio">CASIO</div>
        <div class="model">fx-50FH Ⅱ</div>
      </div>
      <div class="solar"><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="strip">
      <span class="sq"></span><span class="sq"></span><span class="sq"></span>
      <span class="sq"></span><span class="sq big"></span>
      <span class="hk">H.K.E.A.A. APPROVED</span>
      <span class="plus">SUPER-FX PLUS</span>
    </div>

    <div class="lcdwrap">
      <div class="lcd" id="lcd">
        <div class="status">
          <span class="i" id="i-s">S</span>
          <span class="i" id="i-a">A</span>
          <span class="i" id="i-m">M</span>
          <span class="i" id="i-h">hyp</span>
          <span class="i" id="i-r">RCL</span>
          <span class="right">
            <span id="i-angle">D</span>
            <span id="i-mode">COMP</span>
            <span id="i-base">DEC</span>
          </span>
        </div>
        <div class="l1"><span id="line1"></span></div>
        <div class="l2" id="line2">0</div>
      </div>
    </div>

    <div class="pad" id="pad"></div>
  </div>
</div>

<p class="hint">
  鍵盤：<b>0-9</b> <b>+ - * /</b> <b>^</b> <b>( )</b> <b>Enter</b>=EXE　<b>Backspace</b>=DEL　<b>Esc</b>=AC　<b>↑↓</b> 回放
</p>

<script>
/* ===========================================================
   CASIO fx-50FH II — web emulation
   =========================================================== */


/* ---------------- 1. state ---------------- */
const S = {
  expr: '', cur: 0, editing: true,
  ans: 0, mem: 0,
  vars: { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, X: 0, Y: 0 },
  angle: 'DEG', num: 'NORM', digits: 4,
  mode: 'COMP', base: 10,
  shift: false, alpha: false, hyp: false, recall: false,
  frac: false, shown: '0', value: 0,
  menu: null,
  hist: [], hIdx: 0,
  stat: []
};

/* ---------------- 2. errors & maths ---------------- */
class CalcError extends Error {
  constructor(m) { super(m); this.name = 'CalcError'; }
}
const ERR = m => { throw new CalcError(m); };

const RAD = Math.PI / 180;
const toRad = (x, m) => m === 'DEG' ? x * RAD : m === 'GRA' ? x * Math.PI / 200 : x;
const fromRad = (x, m) => m === 'DEG' ? x / RAD : m === 'GRA' ? x * 200 / Math.PI : x;

function clean(x) {
  if (!isFinite(x)) return x;
  const r = parseFloat(x.toPrecision(12));
  return Object.is(r, -0) ? 0 : r;
}

/* ---- complex-aware value arithmetic (COMP / CMPLX share one engine) ---- */
const isC = v => v !== null && typeof v === 'object' && 're' in v;
const toC = v => isC(v) ? v : { re: v, im: 0 };
const mk = (re, im) => Math.abs(im) < 1e-13 ? clean(re) : { re: clean(re), im: clean(im) };

const add = (a, b) => (!isC(a) && !isC(b)) ? a + b : (A => mk(A.re + toC(b).re, A.im + toC(b).im))(toC(a));
const sub = (a, b) => (!isC(a) && !isC(b)) ? a - b : (A => mk(A.re - toC(b).re, A.im - toC(b).im))(toC(a));
const mul = (a, b) => {
  if (!isC(a) && !isC(b)) return a * b;
  const A = toC(a), B = toC(b);
  return mk(A.re * B.re - A.im * B.im, A.re * B.im + A.im * B.re);
};
const div = (a, b) => {
  if (!isC(a) && !isC(b)) return b === 0 ? ERR('Math ERROR') : a / b;
  const A = toC(a), B = toC(b);
  const d = B.re * B.re + B.im * B.im;
  if (!d) ERR('Math ERROR');
  return mk((A.re * B.re + A.im * B.im) / d, (A.im * B.re - A.re * B.im) / d);
};
function pow(a, b) {
  if (!isC(a) && !isC(b)) {
    const r = Math.pow(a, b);
    if (isNaN(r) && !isNaN(a) && !isNaN(b)) ERR('Math ERROR');
    return r;
  }
  const A = toC(a), B = toC(b);
  const r = Math.hypot(A.re, A.im);
  if (r === 0) return 0;
  const th = Math.atan2(A.im, A.re);
  const lnr = Math.log(r);
  const x = Math.exp(B.re * lnr - B.im * th);
  const y = B.re * th + B.im * lnr;
  return mk(x * Math.cos(y), x * Math.sin(y));
}
const absV = v => isC(v) ? Math.hypot(v.re, v.im) : Math.abs(v);
const isReal = v => !isC(v);

function factorial(n) {
  if (isC(n)) ERR('Math ERROR');
  if (n < 0 || Math.abs(n - Math.round(n)) > 1e-9) ERR('Math ERROR');
  n = Math.round(n);
  if (n > 170) ERR('Math ERROR');
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}
function nPr(n, r) {
  if (isC(n) || isC(r)) ERR('Math ERROR');
  n = Math.round(n); r = Math.round(r);
  if (n < 0 || r < 0 || r > n) ERR('Math ERROR');
  return factorial(n) / factorial(n - r);
}
function nCr(n, r) {
  if (isC(n) || isC(r)) ERR('Math ERROR');
  n = Math.round(n); r = Math.round(r);
  if (n < 0 || r < 0 || r > n) ERR('Math ERROR');
  r = Math.min(r, n - r);
  let out = 1;
  for (let i = 0; i < r; i++) out = out * (n - i) / (i + 1);
  return clean(out);
}

/* ---------------- 3. tokenizer ---------------- */
const FUNCS = ['asin', 'acos', 'atan', 'sinh', 'cosh', 'tanh', 'asinh', 'acosh', 'atanh',
  'sin', 'cos', 'tan', 'log', 'ln', 'sqrt', 'cbrt', 'abs', 'exp', 'RanInt', 'Conjg', 'Pol', 'Rec', 'Rnd',
  'And', 'Or', 'Xor', 'Not'];
const CONSTS = ['Ans', 'e'];
const VARS = ['A', 'B', 'C', 'D', 'E', 'F', 'X', 'Y', 'M'];
const KNOWN = new Set([...FUNCS, ...CONSTS, ...VARS, 'nPr', 'nCr', 'i']);
const MAXWORD = 6;
const OPS = new Set(['+', '-', '×', '÷', '^', '(', ')', ',', '!', '%', '°', "'", '"']);

function readWord(src, i) {
  for (let len = Math.min(MAXWORD, src.length - i); len >= 1; len--) {
    const w = src.slice(i, i + len);
    if (KNOWN.has(w)) return w;
  }
  return null;
}

function tokenize(src) {
  const out = [];
  let i = 0;
  const n = src.length;
  const isDigit = c => c >= '0' && c <= '9';

  while (i < n) {
    const c = src[i];
    if (c === ' ') { i++; continue; }

    /* number, with Casio-style E exponent (2E3) */
    if (isDigit(c) || c === '.') {
      let j = i, dot = false;
      while (j < n && (isDigit(src[j]) || (src[j] === '.' && !dot))) {
        if (src[j] === '.') dot = true;
        j++;
      }
      let val = parseFloat(src.slice(i, j));
      i = j;
      const expAhead = isDigit(src[i + 1] || '') ||
        ((src[i + 1] === '+' || src[i + 1] === '-') && isDigit(src[i + 2] || ''));
      if (src[i] === 'E' && expAhead) {
        let k = i + 1, sign = 1;
        if (src[k] === '+' ) k++;
        else if (src[k] === '-') { sign = -1; k++; }
        let m = k;
        while (m < n && isDigit(src[m])) m++;
        if (m > k) { val = val * Math.pow(10, sign * parseInt(src.slice(k, m), 10)); i = m; }
      }
      out.push({ t: 'num', v: val });
      continue;
    }

    /* π */
    if (c === 'π') { out.push({ t: 'name', v: 'PI' }); i++; continue; }

    /* words: functions, constants, variables */
    if (/[A-Za-z]/.test(c)) {
      const w = readWord(src, i);
      if (!w) { ERR('Syntax ERROR'); }
      out.push({ t: 'name', v: w });
      i += w.length;
      continue;
    }

    if (OPS.has(c)) {
      const prev = out[out.length - 1];
      const unaryMinus = c === '-' &&
        (!prev || (prev.t === 'op' && ![')', '!', '%'].includes(prev.v)));
      out.push({ t: 'op', v: c, unary: unaryMinus });
      i++;
      continue;
    }
    if (c === '*') { out.push({ t: 'op', v: '×' }); i++; continue; }
    if (c === '/') { out.push({ t: 'op', v: '÷' }); i++; continue; }
    if (c === '√') { out.push({ t: 'name', v: 'sqrt' }); i++; continue; }

    ERR('Syntax ERROR');
  }
  return out;
}

/* ---------------- 4. parser ---------------- */
class Parser {
  constructor(tokens, ctx) { this.t = tokens; this.i = 0; this.c = ctx; }
  peek() { return this.t[this.i]; }
  next() { return this.t[this.i++]; }
  isOp(v) { const k = this.peek(); return k && k.t === 'op' && k.v === v; }

  parse() {
    if (!this.t.length) return null;
    const v = this.expr();
    if (this.i < this.t.length) ERR('Syntax ERROR');
    return v;
  }

  expr() {
    let v = this.term();
    for (;;) {
      const k = this.peek();
      if (k && k.t === 'op' && (k.v === '+' || k.v === '-') && !k.unary) {
        this.next();
        v = k.v === '+' ? add(v, this.term()) : sub(v, this.term());
      } else break;
    }
    return v;
  }

  term() {
    let v = this.unary();
    for (;;) {
      const k = this.peek();
      if (!k) break;
      if (k.t === 'op' && (k.v === '×' || k.v === '÷')) {
        this.next();
        const r = this.unary();
        v = k.v === '×' ? mul(v, r) : div(v, r);
      } else if (k.t === 'op' && k.v === 'E') {
        this.next();
        v = mul(v, pow(10, this.unary()));
      } else if (k.t === 'name' && (k.v === 'nPr' || k.v === 'nCr')) {
        this.next();
        const r = this.unary();
        v = k.v === 'nPr' ? nPr(v, r) : nCr(v, r);
      } else if (this.startsPrimary(k)) {
        v = mul(v, this.unary());
      } else break;
    }
    return v;
  }

  startsPrimary(k) {
    if (k.t === 'num') return true;
    if (k.t === 'name') return !['nPr', 'nCr'].includes(k.v);
    return k.t === 'op' && k.v === '(';
  }

  unary() {
    const k = this.peek();
    if (k && k.t === 'op' && (k.v === '+' || k.v === '-') && k.unary) {
      this.next();
      const v = this.unary();
      return k.v === '-' ? mul(-1, v) : v;
    }
    return this.power();
  }

  power() {
    const base = this.postfix();
    if (this.isOp('^')) {
      this.next();
      return pow(base, this.unary());
    }
    return base;
  }

  postfix() {
    let v = this.primary();
    for (;;) {
      const k = this.peek();
      if (!k || k.t !== 'op') break;
      if (k.v === '!') { this.next(); v = factorial(v); }
      else if (k.v === '%') { this.next(); v = div(v, 100); }
      else if (k.v === '°' || k.v === "'" || k.v === '"') { v = this.dms(v); }
      else break;
    }
    return v;
  }

  /* 1°30°0 → decimal degrees (positional), ' and " fix the unit */
  dms(start) {
    if (isC(start)) ERR('Math ERROR');
    const POS = [1, 1 / 60, 1 / 3600];
    let total = 0, idx = 0, cur = start;
    for (;;) {
      const k = this.peek();
      if (!k || k.t !== 'op' || !['°', "'", '"'].includes(k.v)) break;
      this.next();
      const w = k.v === "'" ? 1 / 60 : k.v === '"' ? 1 / 3600 : (POS[idx] ?? 0);
      total += cur * w;
      idx++;
      const nx = this.peek();
      if (nx && nx.t === 'num') cur = this.next().v;
      else return total;
    }
    return total;
  }

  primary() {
    const k = this.next();
    if (!k) ERR('Syntax ERROR');

    if (k.t === 'num') {
      const nx = this.peek();
      if (nx && nx.t === 'op' && (nx.v === '°' || nx.v === "'" || nx.v === '"')) return this.dms(k.v);
      return k.v;
    }

    if (k.t === 'op' && k.v === '(') {
      if (this.isOp(')')) { this.next(); return 0; }
      const v = this.expr();
      if (!this.isOp(')')) ERR('Syntax ERROR');
      this.next();
      return v;
    }

    if (k.t === 'name') {
      const name = k.v;
      if (name === 'PI') return Math.PI;
      if (name === 'e') return Math.E;
      if (name === 'i') return { re: 0, im: 1 };
      if (name === 'Ans') return this.c.ans;
      if (VARS.includes(name)) return this.c.vars[name] || 0;
      if (name === 'Ran') return Math.random();
      if (name === 'Rnd') return Math.round(this.args()[0]);
      if (name === 'RanInt') {
        const a = this.args();
        if (a.length !== 2) ERR('Syntax ERROR');
        return Math.floor(Math.random() * (Math.floor(a[1]) - Math.ceil(a[0]) + 1)) + Math.ceil(a[0]);
      }
      return applyFn(name, this.args(), this.c);
    }

    ERR('Syntax ERROR');
  }

  args() {
    const out = [];
    if (this.isOp('(')) {
      this.next();
      if (this.isOp(')')) { this.next(); return out; }
      out.push(this.expr());
      while (this.isOp(',')) { this.next(); out.push(this.expr()); }
      if (!this.isOp(')')) ERR('Syntax ERROR');
      this.next();
    } else {
      out.push(this.unary());
    }
    return out;
  }
}

/* ---------------- 5. functions ---------------- */
function applyFn(name, a, c) {
  const x = a[0];
  const need = () => { if (a.length !== 1) ERR('Syntax ERROR'); };
  const real = () => { if (isC(x)) ERR('Math ERROR'); return x; };
  const ang = v => toRad(v, c.angle);
  const back = v => fromRad(v, c.angle);

  if (name === 'abs') { need(); return clean(absV(x)); }
  if (name === 'Conjg') { need(); return isC(x) ? mk(x.re, -x.im) : x; }

  switch (name) {
    case 'sqrt': {
      need();
      if (isC(x)) {
        const r = Math.hypot(x.re, x.im), th = Math.atan2(x.im, x.re) / 2;
        return mk(Math.sqrt(r) * Math.cos(th), Math.sqrt(r) * Math.sin(th));
      }
      if (x < 0) {
        if (c.mode === 'CMPLX') return mk(0, Math.sqrt(-x));
        ERR('Math ERROR');
      }
      return clean(Math.sqrt(x));
    }
    case 'cbrt': need(); return clean(Math.cbrt(real()));
    case 'sin': need(); return clean(Math.sin(ang(real())));
    case 'cos': need(); return clean(Math.cos(ang(real())));
    case 'tan': {
      need();
      const r = Math.tan(ang(real()));
      if (Math.abs(r) > 1e12) ERR('Math ERROR');
      return clean(r);
    }
    case 'asin': need(); { const v = real(); if (v < -1 || v > 1) ERR('Math ERROR'); return clean(back(Math.asin(v))); }
    case 'acos': need(); { const v = real(); if (v < -1 || v > 1) ERR('Math ERROR'); return clean(back(Math.acos(v))); }
    case 'atan': need(); return clean(back(Math.atan(real())));
    case 'sinh': need(); return clean(Math.sinh(real()));
    case 'cosh': need(); return clean(Math.cosh(real()));
    case 'tanh': need(); return clean(Math.tanh(real()));
    case 'asinh': need(); return clean(Math.asinh(real()));
    case 'acosh': need(); { const v = real(); if (v < 1) ERR('Math ERROR'); return clean(Math.acosh(v)); }
    case 'atanh': need(); { const v = real(); if (v <= -1 || v >= 1) ERR('Math ERROR'); return clean(Math.atanh(v)); }
    case 'log': need(); { const v = real(); if (v <= 0) ERR('Math ERROR'); return clean(Math.log10(v)); }
    case 'ln': need(); { const v = real(); if (v <= 0) ERR('Math ERROR'); return clean(Math.log(v)); }
    case 'exp': need(); return clean(Math.exp(real()));
    case 'And': { if (a.length !== 2) ERR('Syntax ERROR'); return Math.floor(real0(a[0])) & Math.floor(real0(a[1])); }
    case 'Or':  { if (a.length !== 2) ERR('Syntax ERROR'); return Math.floor(real0(a[0])) | Math.floor(real0(a[1])); }
    case 'Xor': { if (a.length !== 2) ERR('Syntax ERROR'); return Math.floor(real0(a[0])) ^ Math.floor(real0(a[1])); }
    case 'Not': { need(); return ~Math.floor(real0(x)); }
    case 'Pol': {
      if (a.length !== 2) ERR('Syntax ERROR');
      return clean(Math.hypot(real0(a[0]), real0(a[1])));
    }
    case 'Rec': {
      if (a.length !== 2) ERR('Syntax ERROR');
      return clean(real0(a[0]) * Math.cos(ang(real0(a[1]))));
    }
    default: ERR('Syntax ERROR');
  }
}
const real0 = v => { if (isC(v)) ERR('Math ERROR'); return v; };


/* ---------------- 6. display formatting ---------------- */
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const BASES = { 10: 'DEC', 16: 'HEX', 2: 'BIN', 8: 'OCT' };
const DIGITS = '0123456789ABCDEF';

function toBase(n, b) {
  const neg = n < 0;
  n = Math.abs(Math.round(n));
  if (n === 0) return '0';
  let s = '';
  while (n > 0) { s = DIGITS[n % b] + s; n = Math.floor(n / b); }
  return (neg ? '-' : '') + s;
}

function expHTML(mant, exp) {
  const m = (mant.replace(/0+$/, '').replace(/\.$/, '')) || '0';
  return `${m}×10<sup>${exp}</sup>`;
}

function fmtReal(x) {
  x = clean(x);
  if (!isFinite(x)) return 'Math ERROR';

  if (S.base !== 10) {
    if (Math.abs(x - Math.round(x)) > 1e-9) return toBase(x, 10) + ' (非整數)';
    return toBase(x, S.base);
  }
  if (x === 0) return '0';
  const neg = x < 0, a = Math.abs(x), d = Math.min(S.digits, 9);

  if (S.num === 'FIX') return (neg ? '-' : '') + a.toFixed(d);
  if (S.num === 'SCI') {
    const [m, e] = a.toExponential(d).split('e');
    return (neg ? '-' : '') + expHTML(m, parseInt(e, 10));
  }
  if (S.num === 'ENG') {
    const e = Math.floor(Math.log10(a) / 3) * 3;
    const m = parseFloat((a / Math.pow(10, e)).toPrecision(10));
    return (neg ? '-' : '') + m + (e === 0 ? '' : `×10<sup>${e}</sup>`);
  }
  if (a >= 1e10 || a < 1e-9) {
    const [m, e] = a.toExponential(9).split('e');
    return (neg ? '-' : '') + expHTML(m, parseInt(e, 10));
  }
  return (neg ? '-' : '') + String(parseFloat(a.toPrecision(10)));
}

function fmtComplex(v) {
  const re = clean(v.re), im = clean(v.im);
  if (Math.abs(im) < 1e-12) return fmtReal(re);
  const sign = im < 0 ? '−' : '+';
  const m = Math.abs(im);
  const imTxt = Math.abs(m - 1) < 1e-12 ? 'i' : fmtReal(m) + 'i';
  if (Math.abs(re) < 1e-12) return (im < 0 ? '−' : '') + imTxt;
  return fmtReal(re) + sign + imTxt;
}

const fmtV = v => isC(v) ? fmtComplex(v) : fmtReal(v);

function toFrac(x) {
  if (!isFinite(x) || x === 0 || isC(x)) return null;
  const sign = x < 0 ? -1 : 1;
  const v = Math.abs(x);
  let h1 = 1, h2 = 0, k1 = 0, k2 = 1, b = v;
  for (let i = 0; i < 40; i++) {
    const a = Math.floor(b);
    const h = a * h1 + h2, k = a * k1 + k2;
    h2 = h1; h1 = h; k2 = k1; k1 = k;
    if (k > 1e6 || !isFinite(k)) break;
    if (Math.abs(v - h / k) <= 1e-11 * Math.max(1, v)) return { n: sign * h, d: k };
    if (b - a < 1e-12) break;
    b = 1 / (b - a);
  }
  return null;
}

function fracHTML(x, mixed) {
  const f = toFrac(x);
  if (!f) return null;
  const neg = f.n < 0;
  let n = Math.abs(f.n);
  const d = f.d;
  const stack = (a, b) =>
    `<span class="frac"><span>${a}</span><span class="bar"></span><span>${b}</span></span>`;
  if (mixed && n > d) {
    const whole = Math.floor(n / d), rem = n % d;
    return (neg ? '-' : '') + whole + (rem ? stack(rem, d) : '');
  }
  if (n === 0) return '0';
  return (neg ? '-' : '') + stack(n, d);
}

  if (e.length > MAX) start = Math.max(0, Math.min(S.cur - (MAX - 7), e.length - MAX));
  const seg = e.slice(start, start + MAX);
  const c = S.cur - start;
  return (start > 0 ? '‹' : '') +
    esc(seg.slice(0, c)) +
    (S.editing ? '<span class="caret"></span>' : '') +
    esc(seg.slice(c));
}

  if (it && it.fn) it.fn();

  const m = S.menu;

  m.cur = (m.cur + d + m.items.length) % m.items.length;

}

  const m = S.menu;
  if (!m || i < 0 || i >= m.items.length) return;
  m.cur = i;
  chooseMenu();
}

/* ---------------- 11. statistics ---------------- */
const statSum = () => S.stat.reduce((a, b) => a + b, 0);
const statSum2 = () => S.stat.reduce((a, b) => a + b * b, 0);
const mean = () => S.stat.length ? statSum() / S.stat.length : 0;
const sdPop = () => {
  const n = S.stat.length;
  if (!n) return 0;
  const m = mean();
  return Math.sqrt(S.stat.reduce((a, b) => a + (b - m) * (b - m), 0) / n);
};
const sdSample = () => {
  const n = S.stat.length;
  if (n < 2) return 0;
  const m = mean();
  return Math.sqrt(S.stat.reduce((a, b) => a + (b - m) * (b - m), 0) / (n - 1));
};
function regress() {
  const n = S.stat.length;
  if (n < 2) return { a: 0, b: 0, r: 0 };
  const m = mean();
  const my = m;
  let sxy = 0, sxx = 0, syy = 0;
  S.stat.forEach((y, i) => {
    const x = i + 1;
    sxy += (x - (n + 1) / 2) * (y - my);
    sxx += (x - (n + 1) / 2) * (x - (n + 1) / 2);
    syy += (y - my) * (y - my);
  });
  const b = sxx ? sxy / sxx : 0;
  const a = my - b * (n + 1) / 2;
  const r = (sxx && syy) ? sxy / Math.sqrt(sxx * syy) : 0;
  return { a: clean(a), b: clean(b), r: clean(r) };
}

/* ---------------- 12. editing / evaluation ---------------- */
function toInternal(s) {
  return s.replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁻¹/g, '^-1').replace(/∛/g, 'cbrt');
}

function insertValue(v) {
  S.value = v; S.ans = v;
  S.shown = typeof v === 'number' ? fmtReal(v) : String(v);
  S.editing = false; S.expr = ''; S.cur = 0;
}

function insert(text) {
  if (!S.editing) {
    if (/^[0-9.]$/.test(text)) { S.expr = ''; S.cur = 0; }
    else if (/^[+\-×÷^²³!%]/.test(text)) { S.expr = 'Ans'; S.cur = 3; }
    else { S.expr = ''; S.cur = 0; }
    S.editing = true;
    S.frac = false;
  }
  S.expr = S.expr.slice(0, S.cur) + text + S.expr.slice(S.cur);
  S.cur += text.length;
  render();
}

function evaluate() {
  if (!S.expr.trim()) return;
  try {
    const v = new Parser(tokenize(toInternal(S.expr)), S).parse();
    if (v === null) return;
    if (typeof v === 'number' && isNaN(v)) ERR('Math ERROR');
    S.value = v;
    S.ans = v;
    S.frac = false;
    S.shown = fmtV(v);
    S.hist.push(S.expr);
    if (S.hist.length > 40) S.hist.shift();
    S.hIdx = S.hist.length;
    S.editing = false;
  } catch (err) {
    S.shown = esc(err instanceof CalcError ? err.message : 'Syntax ERROR');
    S.editing = true;
  }
  render();
}

let msgTimer = null;
function message(t) {
  clearTimeout(msgTimer);
  S.shown = esc(t);
  render();
  msgTimer = setTimeout(() => { S.shown = fmtV(S.value); render(); }, 1800);
}

/* ---------------- 13. commands ---------------- */
function command(cmd, arg) {
  switch (cmd) {
    case 'eq': evaluate(); break;

    case 'ac':
      S.expr = ''; S.cur = 0; S.shown = '0'; S.editing = true;
      S.shift = false; S.alpha = false; S.hyp = false; S.recall = false; S.frac = false;
      break;

    case 'on':
      S.expr = ''; S.cur = 0; S.shown = '0'; S.editing = true;
      S.shift = S.alpha = S.hyp = S.recall = S.frac = false;
      S.menu = null;
      break;

    case 'off': message('已關機（按 ON 開機）'); break;

    case 'del':
      if (!S.editing) { S.expr = ''; S.cur = 0; S.editing = true; break; }
      if (S.cur > 0) {
        S.expr = S.expr.slice(0, S.cur - 1) + S.expr.slice(S.cur);
        S.cur--;
      }
      break;

    case 'left': S.editing = true; S.cur = Math.max(0, S.cur - 1); break;
    case 'right': S.editing = true; S.cur = Math.min(S.expr.length, S.cur + 1); break;

    case 'up':
      if (S.hist.length) {
        if (S.hIdx > S.hist.length) S.hIdx = S.hist.length;
        S.hIdx = Math.max(0, S.hIdx - 1);
        S.expr = S.hist[S.hIdx] || '';
        S.cur = S.expr.length; S.editing = true;
      }
      break;

    case 'down':
      if (S.hist.length) {
        S.hIdx = Math.min(S.hist.length, S.hIdx + 1);
        S.expr = S.hist[S.hIdx] || '';
        S.cur = S.expr.length; S.editing = true;
      }
      break;

    case 'hyp': S.hyp = !S.hyp; break;
    case 'rcl': S.recall = !S.recall; break;

    case 'sto': S.stoPending = true; message('STO'); break;

    case 'frac': {
      if (S.value === 0 || isC(S.value)) { message('a b/c'); break; }
      const f = fracHTML(S.value, true);
      if (!f) { message('無法轉為分數'); break; }
      S.frac = !S.frac;
      S.shown = S.frac ? f : fmtV(S.value);
      S.editing = false;
      break;
    }

    case 'dc': {
      if (S.value === 0 || isC(S.value)) { message('d/c'); break; }
      const f = fracHTML(S.value, false);
      if (!f) { message('無法轉為分數'); break; }
      S.frac = true; S.shown = f; S.editing = false;
      break;
    }

    case 'eng':
      S.num = S.num === 'ENG' ? 'NORM' : 'ENG';
      S.shown = fmtV(S.value);
      break;

    case 'engback':
      S.num = 'NORM';
      S.shown = fmtV(S.value);
      break;

    case 'mplus':
      if (S.mode === 'SD' || S.mode === 'REG') { addDatum(); break; }
      S.mem = clean(S.mem + S.value);
      message('M = ' + fmtV(S.mem));
      break;

    case 'mminus':
      S.mem = clean(S.mem - S.value);
      message('M = ' + fmtV(S.mem));
      break;

    case 'dt': addDatum(); break;

    case 'base':
      S.base = Number(arg);
      S.shown = fmtV(S.value);
      break;

    case 'drg': {
      const order = ['DEG', 'RAD', 'GRA'];
      const i = order.indexOf(S.angle);
      S.angle = order[(i + 1) % 3];
      message('角度單位 → ' + S.angle);
      break;
    }

    case 'dmsdec': {
      message('→ 已在輸入時自動換算');
      break;
    }

    case 'mode': MENU.mode(); break;
    case 'setup': MENU.setup(); break;
    case 'logic': MENU.logic(); break;
    case 'ssum': MENU.ssum(); break;
    case 'svar': MENU.svar(); break;
    case 'clr': MENU.clr(); break;

    case 'prog': message('PRGM 模式未收錄'); break;
    case 'fmla': message('內置公式未收錄'); break;
    case 'const': message('科學常數未收錄'); break;
    case 'conv': message('單位換算未收錄'); break;
    case 'pcmd': message('程式指令未收錄'); break;
    case 'ins': message('INS 未收錄'); break;

    default: break;
  }
  render();
}

function addDatum() {
  if (isC(S.value)) { message('Math ERROR'); return; }
  S.stat.push(S.value);
  message(`n = ${S.stat.length}`);
}

/* ---------------- 14. key dispatch ---------------- */
function runAction(a) {
  if (!a) return;
  const i = a.indexOf(':');
  const kind = i < 0 ? a : a.slice(0, i);
  const v = i < 0 ? '' : a.slice(i + 1);

  if (kind === 'mod') {
    if (v === 'shift') { S.shift = !S.shift; S.alpha = false; }
    else { S.alpha = !S.alpha; S.shift = false; }
    render();
    return;
  }
  if (kind === 'msg') { message(v); return; }
  if (kind === 'cmd') {
    if (v.includes(':')) command(v.split(':')[0], v.split(':')[1]);
    else command(v);
    return;
  }
  if (kind === 'ins') {
    let text = v;
    if (S.hyp && /^a?(sin|cos|tan)\($/.test(text)) {
      text = text.replace('(', 'h(');
      S.hyp = false;
    }
    insert(text);
  }
}

function pressKey(btn) {
  let act = btn.dataset.act;

  /* menu navigation takes over the keypad, exactly like the real device */
  if (S.menu) {
    const m = act.match(/^ins:([1-9])$/);
    if (m) return selectMenu(Number(m[1]) - 1);
    if (act === 'cmd:eq') return chooseMenu();
    if (act === 'cmd:ac' || act === 'cmd:del' || act === 'cmd:on') return closeMenu();
    if (act === 'cmd:left') return moveMenu(-1);
    if (act === 'cmd:right') return moveMenu(1);
    if (act === 'cmd:up') return moveMenu(-2);
    if (act === 'cmd:down') return moveMenu(2);
    return;
  }

  /* RCL / STO: the next letter key addresses that variable */
  if (S.recall) {
    S.recall = false;
    if (btn.dataset.av) {
      const v = S.vars[btn.dataset.av];
      S.value = v; S.ans = v; S.shown = fmtV(v); S.editing = false;
    }
    render();
    return;
  }
  if (S.stoPending) {
    S.stoPending = false;
    if (btn.dataset.av) {
      S.vars[btn.dataset.av] = S.value;
      message(btn.dataset.av + ' ← ' + fmtV(S.value));
      return;
    }
    render();
    return;
  }

  if (S.shift) {
    act = btn.dataset.sact;
    if (!act) { S.shift = false; render(); return; }   /* no legend → nothing happens */
  } else if (S.alpha) {
    act = btn.dataset.aact;
    if (!act) { S.alpha = false; render(); return; }
  }
  S.shift = false; S.alpha = false;
  runAction(act);
}

/* ---------------- 15. keyboard ---------------- */
const KEYMAP = {
  '0': 'ins:0', '1': 'ins:1', '2': 'ins:2', '3': 'ins:3', '4': 'ins:4',
  '5': 'ins:5', '6': 'ins:6', '7': 'ins:7', '8': 'ins:8', '9': 'ins:9',
  '.': 'ins:.', '+': 'ins:+', '-': 'ins:-', '*': 'ins:×', '/': 'ins:÷',
  '^': 'ins:^', '(': 'ins:(', ')': 'ins:)', ',': 'ins:,', '%': 'ins:%',
  '!': 'ins:!', '=': 'cmd:eq', 'Enter': 'cmd:eq',
  'Backspace': 'cmd:del', 'Delete': 'cmd:del', 'Escape': 'cmd:ac',
  'ArrowLeft': 'cmd:left', 'ArrowRight': 'cmd:right',
  'ArrowUp': 'cmd:up', 'ArrowDown': 'cmd:down'
};

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const act = KEYMAP[e.key];
  if (!act) return;
  e.preventDefault();
  if (S.menu) {
    const m = act.match(/^ins:([1-9])$/);
    if (m) return selectMenu(Number(m[1]) - 1);
    if (act === 'cmd:eq') return chooseMenu();
    if (act === 'cmd:ac' || act === 'cmd:del') return closeMenu();
    if (act === 'cmd:left') return moveMenu(-1);
    if (act === 'cmd:right') return moveMenu(1);
    if (act === 'cmd:up') return moveMenu(-2);
    if (act === 'cmd:down') return moveMenu(2);
    return;
  }
  runAction(act);
});

/* ---------------- 16. boot ---------------- */
buildPad();
render();

</script>
